version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bd-locator-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdlocator}
      POSTGRES_USER: ${POSTGRES_USER:-bdlocator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdlocator}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdlocator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bd-locator-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bdlocator}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bdlocator}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bdlocator}
      CQC_SUBSCRIPTION_KEY: ${CQC_SUBSCRIPTION_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      # Mount local data/ directory so CQC CSV is accessible at /data inside the container
      - ../data:/data:ro
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: bd-locator-frontend
    depends_on:
      - backend
    environment:
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
    ports:
      - "3000:3000"

volumes:
  pgdata:
